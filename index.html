<style>
  :root{
    --stone:#E6E1DB; --paper:#FFFFFF; --navy:#1C2B4B; --bronze:#FFFFFF; --navy-soft:#2E3F63;
    --wine:#7B2332; --taupe:#4E4540; --ink:#1E2230; --ink-2:#4A4F5E; --ink-3:#7A7F8C; --line:#D3DFEC; --tint:#E5EEF8;
    --photo-bg:#FFFFFF;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --stone:#16181F; --paper:#22252E; --ink:#F1EEEA; --ink-2:#C9C5C0; --ink-3:#9A968F; --line:#33363F; --tint:#22252E; --navy-soft:#AFC0E3; --wine:#C8606F;
  }}
  :root[data-theme="dark"]{
    --stone:#16181F; --paper:#22252E; --ink:#F1EEEA; --ink-2:#C9C5C0; --ink-3:#9A968F; --line:#33363F; --tint:#22252E; --navy-soft:#AFC0E3; --wine:#C8606F;
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0; background:var(--stone); color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex; justify-content:center; padding:28px 16px 40px;}
  .card{width:100%; max-width:420px; background:var(--paper); border-radius:26px; overflow:hidden;
    box-shadow:0 24px 50px -24px rgba(28,43,75,.45);}

  /* 사진 영역 — 이 명함의 중심 */
  .hero{position:relative; background:var(--photo-bg); aspect-ratio:10/11; overflow:hidden;}
  .hero img{display:block; width:100%; height:100%; object-fit:cover; object-position:center top;}
  .hero-text{background:var(--bronze); padding:12px 26px 10px; color:var(--navy);}
  .church{margin:0 0 6px; font-size:14px; font-weight:500; opacity:.88;}
  h1{margin:0; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:34px; letter-spacing:.02em; line-height:1.1;}
  h1 small{font-size:20px; font-weight:700; margin-left:8px; opacity:.92;}
  .role{margin:3px 0 0; line-height:1.3; font-size:14px; font-weight:500;}

  .motto{margin:0; padding:10px 26px 12px; border-top:1px solid rgba(28,43,75,.18); background:var(--bronze); color:var(--navy);
    font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:15.5px; line-height:1.3; letter-spacing:-.01em;}
  .motto cite{display:inline; margin-left:2px; white-space:nowrap; font-family:'Noto Sans KR',sans-serif; font-style:normal; font-weight:400; font-size:12.5px; opacity:.8;}

  .body{padding:24px 22px 26px; background:var(--tint);}
  .actions{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .act{display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px 10px;
    border-radius:14px; text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;}
  .act:hover{background:var(--line)}
  .act:focus-visible{outline:2px solid var(--navy-soft); outline-offset:2px}
  .ic{width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--navy-soft); color:var(--navy-soft);}
  .ic svg{width:22px; height:22px}

  .info{margin:22px 0 0; padding:0; list-style:none; border-top:1px solid var(--line);}
  .info li{display:grid; grid-template-columns:72px 1fr; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:15px; line-height:1.4;}
  .info .k{color:var(--ink-3); font-size:13.5px; padding-top:1px}
  .info .v{color:var(--ink)}
  .info a{color:inherit; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px}

  .about{margin:20px 2px 0; font-size:15px; line-height:1.75; color:var(--ink-2);}

  .save{display:block; width:100%; margin-top:24px; padding:16px; border:0; border-radius:14px; cursor:pointer;
    background:var(--wine); color:#fff; font-family:inherit; font-size:16px; font-weight:700;}
  .save:hover{filter:brightness(1.08)}
  .save:focus-visible{outline:3px solid var(--navy-soft); outline-offset:2px}
  .save[hidden]{display:none}
</style>
